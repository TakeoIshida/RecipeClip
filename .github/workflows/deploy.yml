name: Deploy RecipeClip to App Store Connect

on:
  workflow_dispatch:

concurrency:
  group: recipeclip-app-store-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 26 is required but was not found on this runner."
            ls /Applications | grep Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Import distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$RUNNER_TEMP/build.keychain-db" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/build.keychain-db"

      - name: Set up App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode \
            -o "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Install distribution provisioning profiles
        env:
          MAIN_PROVISION_PROFILE_BASE64: ${{ secrets.MAIN_PROVISION_PROFILE_BASE64 }}
          SHARE_PROVISION_PROFILE_BASE64: ${{ secrets.SHARE_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$MAIN_PROVISION_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/RecipeClip_AppStore.mobileprovision"
          echo -n "$SHARE_PROVISION_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/RecipeClip_Share_AppStore.mobileprovision"

      - name: Verify provisioning profile app groups
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_GROUP="group.com.ishidatakeo.RecipeClip"
          for PROFILE in \
            "$HOME/Library/MobileDevice/Provisioning Profiles/RecipeClip_AppStore.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/RecipeClip_Share_AppStore.mobileprovision"
          do
            PROFILE_PLIST="$RUNNER_TEMP/$(basename "$PROFILE").plist"
            security cms -D -i "$PROFILE" > "$PROFILE_PLIST"
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$PROFILE_PLIST" \
              | grep -F "$EXPECTED_GROUP"
          done

      - name: Run tests
        run: |
          DESTINATION_ID=$(xcrun simctl list devices available | \
            sed -n 's/.*iPhone.*(\([0-9A-Fa-f-]\{36\}\)).*/\1/p' | \
            head -1 | xargs)
          if [ -z "$DESTINATION_ID" ]; then
            echo "An available iPhone simulator was not found."
            xcrun simctl list devices available
            exit 1
          fi
          xcodebuild test \
            -project RecipeClip.xcodeproj \
            -scheme RecipeClip \
            -destination "platform=iOS Simulator,id=$DESTINATION_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project RecipeClip.xcodeproj \
            -scheme RecipeClip \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RecipeClip.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            DEVELOPMENT_TEAM=JS3245KG7Q

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RecipeClip.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/output"

      - name: Verify exported app group entitlements
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_GROUP="group.com.ishidatakeo.RecipeClip"
          IPA_PATH=$(find "$RUNNER_TEMP/output" -maxdepth 1 -name '*.ipa' -print -quit)
          VERIFY_DIR="$RUNNER_TEMP/verify-ipa"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_PATH=$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)
          SHARE_PATH=$(find "$APP_PATH/PlugIns" -maxdepth 1 -name '*.appex' -print -quit)

          for BINARY_PATH in "$APP_PATH" "$SHARE_PATH"
          do
            ENTITLEMENTS_PATH="$RUNNER_TEMP/$(basename "$BINARY_PATH").entitlements.plist"
            codesign -d --entitlements :- "$BINARY_PATH" > "$ENTITLEMENTS_PATH" 2>/dev/null
            /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$ENTITLEMENTS_PATH" \
              | grep -F "$EXPECTED_GROUP"
          done

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/output" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "Exported IPA was not found."
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
